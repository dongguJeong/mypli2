services:
  db:
    image: mysql:8.0
    container_name: mypli-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mypli
      MYSQL_USER: mypli_user
      MYSQL_PASSWORD: mypli_pass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    volumes:
      - /mnt/mypli-data/mysql:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --init-connect='SET NAMES utf8mb4'

  redis:
    image: redis:7-alpine
    container_name: mypli-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "redis_password"]

  api:
    image: dongguj/mypli-api:arm64
    container_name: mypli-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.prod
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: dongguj/mypli-web:arm64
    container_name: mypli-web
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: nginx:stable-alpine
    container_name: mypli_proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
