version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: mypli_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mypli
      MYSQL_USER: mypli
      MYSQL_PASSWORD: mypli
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - mypli-net

  redis:
    image: redis:7
    container_name: mypli_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - mypli-net

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: mypli_api
    depends_on:
      - mysql
      - redis
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_USER: mypli
      DB_PASS: mypli
      DB_NAME: mypli
      REDIS_HOST: redis
    ports:
      - "3001:3001"
    networks:
      - mypli-net

  ml:
    build:
      context: ../apps/ml
      dockerfile: Dockerfile
    container_name: mypli_ml
    restart: always
    ports:
      - "8000:8000"
    networks:
      - mypli-net

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: mypli_web
    ports:
      - "5173:5173"
    networks:
      - mypli-net

networks:
  mypli-net:
    driver: bridge
